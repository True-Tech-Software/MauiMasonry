name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install .NET MAUI workloads
        run: dotnet workload install maui-android maui-ios

      - name: Restore dependencies
        run: dotnet restore MauiMasonry.slnx

      - name: Build solution
        run: dotnet build MauiMasonry.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test tests/MauiMasonry.Tests.csproj --configuration Release --no-build --verbosity normal
