name: CI & Publish NuGet Packages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version override (e.g. 0.2.0). If omitted, auto-increments patch version from latest v*.*.* tag.'
        required: false
        type: string

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore MauiMasonry.slnx

      - name: Build solution
        run: dotnet build MauiMasonry.slnx --configuration Release --no-restore -p:TreatWarningsAsErrors=true

      - name: Run unit tests
        run: dotnet test tests/MauiMasonry.Tests.csproj --configuration Release --no-build --verbosity normal

  publish:
    needs: build-and-test
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository with tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compute next package version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION#v}"
          else
            LATEST_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
            if [ -z "${LATEST_TAG}" ]; then
              VERSION="0.1.0"
            else
              CLEAN="${LATEST_TAG#v}"
              IFS='.' read -r MAJOR MINOR PATCH <<< "${CLEAN}"
              NEXT_PATCH=$((PATCH + 1))
              VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}"
            fi
          fi
          echo "Computed version: ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Pack MauiMasonry.Core and MauiMasonry
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet pack core/MauiMasonry.Core.csproj --configuration Release "-p:PackageVersion=${PACKAGE_VERSION}" --output ./artifacts
          dotnet pack maui/MauiMasonry.csproj --configuration Release "-p:PackageVersion=${PACKAGE_VERSION}" --output ./artifacts

      - name: Authenticate with NuGet Trusted Publishing
        id: nuget-auth
        uses: NuGet/login@v1
        with:
          user: sbrunaugh

      - name: Push to NuGet.org
        run: |
          dotnet nuget push "./artifacts/*.nupkg" --api-key "${{ steps.nuget-auth.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json

      - name: Create GitHub Release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          TAG="v${PACKAGE_VERSION}"
          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "Release ${TAG} already exists."
          else
            gh release create "${TAG}" ./artifacts/*.nupkg \
              --target "${COMMIT_SHA}" \
              --title "${TAG}" \
              --generate-notes
          fi
