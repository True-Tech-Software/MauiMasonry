name: Publish NuGet Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version override (e.g. 0.1.0)'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine package version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref }}
        run: |
          if [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION}"
          elif [[ "${REF_NAME}" == refs/tags/v* ]]; then
            VERSION="${REF_NAME#refs/tags/v}"
          else
            VERSION="0.1.0"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Restore and Test
        run: |
          dotnet restore MauiMasonry.slnx
          dotnet test tests/MauiMasonry.Tests.csproj --configuration Release

      - name: Pack MauiMasonry.Core and MauiMasonry
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet pack core/MauiMasonry.Core.csproj --configuration Release "-p:PackageVersion=${PACKAGE_VERSION}" --output ./artifacts
          dotnet pack maui/MauiMasonry.csproj --configuration Release "-p:PackageVersion=${PACKAGE_VERSION}" --output ./artifacts

      - name: Authenticate with NuGet Trusted Publishing
        id: nuget-auth
        uses: NuGet/login@v1
        with:
          user: sbrunaugh

      - name: Push to NuGet.org
        run: |
          dotnet nuget push "./artifacts/*.nupkg" --api-key "${{ steps.nuget-auth.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
